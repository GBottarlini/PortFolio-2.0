<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard ilustrativo de consumo de papel</title>
  <desc id="desc">Panel con indicadores y gráficos ilustrativos de consumo por oficina.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#surface)"/>
  <rect x="28" y="28" width="904" height="64" rx="16" fill="#0f172a"/>
  <circle cx="62" cy="60" r="12" fill="#2dd4bf"/>
  <text x="88" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Consumo de resmas por oficina</text>
  <g transform="translate(40 120)">
    <rect width="270" height="108" rx="18" fill="#ffffff"/>
    <text x="24" y="38" fill="#64748b" font-family="Arial, sans-serif" font-size="15">Consumo del período</text>
    <text x="24" y="78" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">1.248</text>
    <text x="114" y="78" fill="#64748b" font-family="Arial, sans-serif" font-size="15">resmas</text>
    <g transform="translate(290)">
      <rect width="270" height="108" rx="18" fill="#ffffff"/>
      <text x="24" y="38" fill="#64748b" font-family="Arial, sans-serif" font-size="15">Oficinas registradas</text>
      <text x="24" y="78" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">16</text>
    </g>
    <g transform="translate(580)">
      <rect width="300" height="108" rx="18" fill="#ffffff"/>
      <text x="24" y="38" fill="#64748b" font-family="Arial, sans-serif" font-size="15">Variación intermensual</text>
      <text x="24" y="78" fill="#0f766e" font-family="Arial, sans-serif" font-size="32" font-weight="700">−8,4%</text>
    </g>
  </g>
  <rect x="40" y="252" width="548" height="228" rx="18" fill="#ffffff"/>
  <text x="66" y="286" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Evolución mensual</text>
  <path d="M76 430 C130 390 160 410 214 360 S320 374 372 324 S472 350 550 292" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  <path d="M76 430 C130 390 160 410 214 360 S320 374 372 324 S472 350 550 292 L550 452 L76 452 Z" fill="#2dd4bf" fill-opacity=".14"/>
  <rect x="612" y="252" width="308" height="228" rx="18" fill="#ffffff"/>
  <text x="638" y="286" fill="#0f172a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Consumo por oficina</text>
  <g fill="url(#bar)">
    <rect x="646" y="394" width="32" height="58" rx="7"/>
    <rect x="694" y="350" width="32" height="102" rx="7"/>
    <rect x="742" y="316" width="32" height="136" rx="7"/>
    <rect x="790" y="372" width="32" height="80" rx="7"/>
    <rect x="838" y="334" width="32" height="118" rx="7"/>
  </g>
</svg>
